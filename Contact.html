<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photoshoot Request</title>
  <style>
    body {
      background-color: #1a120b; /* Deep brown */
      color: #e0d2b7; /* Warm gold-beige */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    nav {
      background-color: #2e2e1f; /* Dark olive/brown */
      padding: 15px;
      text-align: center;
    }

    nav a {
      color: #c0a672; /* Muted gold */
      text-decoration: none;
      font-weight: bold;
      margin: 0 15px;
      font-size: 18px;
    }

    nav a:hover {
      color: #98c1a4; /* Dark forest green highlight */
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    form {
      background-color: #2c2c24; /* Deep olive/green tone */
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      color: #f5deb3; /* Light warm gold */
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #e0d2b7;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background-color: #3b3a2e;
      border: 1px solid #5a5a3c;
      border-radius: 6px;
      color: #f5f5f5;
    }

    .package-options {
      margin-top: 10px;
    }

    .package-options label {
      display: block;
      font-weight: normal;
      margin-left: 10px;
      color: #ddd0b4;
    }

    input[type="radio"] {
      margin-right: 8px;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background-color: #665c4e; /* Brownish gold */
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #887b6a;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 20px;
      color: #a89c86;
    }

    footer a {
      color: #c0a672;
      text-decoration: none;
    }

    footer a:hover {
      color: #98c1a4;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="About.html">About</a>
    <a href="Pricing.html">Pricing</a>
    <a href="Contact.html">Contact</a>
  </nav>

  <div class="container">
    <form action="#" method="post">
      <h1>Request a Photoshoot</h1>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" name="phone" required>

      <label>Choose a Package:</label>
      <div class="package-options">
        <label><input type="radio" name="package" value="Mini" required> Mini</label>
        <label><input type="radio" name="package" value="Full"> Full</label>
        <label><input type="radio" name="package" value="Extreme"> Extreme</label>
      </div>

      <label for="comment">Leave a Comment:</label>
      <textarea id="comment" name="comment" rows="4" placeholder="Tell us more about what you're looking for..."></textarea>

      <button type="submit">Submit Request</button>
    </form>

    <p style="margin-top: 40px;">123 Main St.<br>Fayetteville, NC 28303</p>
  </div>

  <footer>
    <p>&copy; 2020 <a href="mailto:rossioh7647@student.faytechcc.edu">Contact Us!</a></p>
  </footer>

</body>
</html>
